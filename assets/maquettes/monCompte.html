<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style type="text/tailwindcss">
        :root {
            --primary-color: #FF0000;--ios-bg: #F2F2F7;
            --ios-card: #FFFFFF;
            --ios-text: #000000;
            --ios-secondary-text: #8E8E93;
            --ios-border: #C6C6C8;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--ios-bg);
            color: var(--ios-text);
        }
        .ios-input {
            @apply block w-full border-0 p-0 text-gray-900 placeholder:text-gray-400 focus:ring-0 sm:text-sm sm:leading-6 bg-transparent;
        }
        .ios-item {
            @apply flex items-center bg-[var(--ios-card)] px-4 py-3 border-b border-[var(--ios-border)] last:border-b-0;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen">
<div class="h-12 bg-[var(--ios-bg)] sticky top-0 z-50 flex items-center justify-between px-6">
<div class="flex items-center gap-1">
<span class="text-sm font-semibold">9:41</span>
</div>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[18px]">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[18px]">wifi</span>
<span class="material-symbols-outlined text-[18px]">battery_full</span>
</div>
</div>
<nav class="sticky top-12 z-40 bg-[var(--ios-bg)]/80 backdrop-blur-md px-4 py-2 border-b border-[var(--ios-border)]">
<div class="flex items-center justify-between">
<button class="flex items-center text-[var(--primary-color)]">
<span class="material-symbols-outlined">chevron_left</span>
<span class="text-lg">Retour</span>
</button>
<h1 class="text-lg font-semibold">Réglages Profil</h1>
<div class="w-16"></div> 
</div>
</nav>
<main class="pb-10">
<div class="px-4 py-6 flex flex-col items-center">
<div class="w-24 h-24 bg-gray-200 rounded-full flex items-center justify-center mb-4 overflow-hidden border-2 border-white shadow-sm">
<span class="material-symbols-outlined text-5xl text-gray-400">person</span>
</div>
<h2 class="text-xl font-bold">Mon Compte</h2>
<div class="mt-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
<span class="w-2 h-2 mr-1.5 bg-green-500 rounded-full"></span>
                Compte Actif
            </div>
</div>
<form action="#" method="POST">
<div class="mb-8">
<h3 class="px-4 mb-2 text-xs font-medium text-[var(--ios-secondary-text)] uppercase tracking-wider">Adresse e-mail</h3>
<div class="bg-[var(--ios-card)] border-y border-[var(--ios-border)]">
<div class="ios-item">
<label class="w-28 text-sm font-medium" for="email">Email</label>
<input class="ios-input" id="email" name="email" type="email" value="user@example.com"/>
</div>
</div>
<p class="px-4 mt-2 text-xs text-[var(--ios-secondary-text)]">Ceci est l'adresse utilisée pour votre compte et vos recherches.</p>
</div>
<div class="mb-8">
<h3 class="px-4 mb-2 text-xs font-medium text-[var(--ios-secondary-text)] uppercase tracking-wider">Sécurité</h3>
<div class="bg-[var(--ios-card)] border-y border-[var(--ios-border)]">
<div class="ios-item">
<label class="w-28 text-sm font-medium whitespace-nowrap" for="new_password">Nouveau</label>
<input class="ios-input" id="new_password" name="new_password" placeholder="Min. 8 car., 1 maj, 1 chiffre" type="password"/>
</div>
<div class="ios-item">
<label class="w-28 text-sm font-medium" for="confirm_password">Confirmer</label>
<input class="ios-input" id="confirm_password" name="confirm_password" placeholder="Répéter le mot de passe" type="password"/>
</div>
</div>
</div>
<div class="mb-8">
<h3 class="px-4 mb-2 text-xs font-medium text-[var(--ios-secondary-text)] uppercase tracking-wider">Infos compte</h3>
<div class="bg-[var(--ios-card)] border-y border-[var(--ios-border)]">
<div class="ios-item justify-between">
<span class="text-sm font-medium">Date d'inscription</span>
<span class="text-sm text-[var(--ios-secondary-text)]">12 Octobre 2023</span>
</div>
<div class="ios-item justify-between">
<span class="text-sm font-medium">Catégories créées</span>
<span class="text-sm text-[var(--ios-secondary-text)]">8</span>
</div>
</div>
</div>
<div class="px-4 space-y-4">
<button class="w-full bg-[var(--primary-color)] text-white font-semibold py-4 rounded-xl shadow-sm active:opacity-80 transition-opacity" type="submit">
                    Enregistrer les modifications
                </button>
<button class="w-full bg-[var(--ios-card)] text-red-600 font-semibold py-4 rounded-xl shadow-sm border border-[var(--ios-border)] flex items-center justify-center gap-2 active:bg-gray-50 transition-colors" type="button">
<span class="material-symbols-outlined text-xl">logout</span>
                    Déconnexion
                </button>
</div>
</form>
<div class="mt-12 px-4 mb-8">
<button class="w-full text-sm text-[var(--ios-secondary-text)] underline decoration-gray-300">
                Supprimer mon compte définitivement
            </button>
</div>
</main>
<div class="fixed bottom-0 left-0 right-0 bg-[var(--ios-bg)]/80 backdrop-blur-md border-t border-[var(--ios-border)] flex justify-around items-center pt-2 pb-8">
<button class="flex flex-col items-center gap-1 text-[var(--ios-secondary-text)]">
<span class="material-symbols-outlined">library_books</span>
<span class="text-[10px] font-medium">Catégories</span>
</button>
<button class="flex flex-col items-center gap-1 text-[var(--ios-secondary-text)]">
<span class="material-symbols-outlined">search</span>
<span class="text-[10px] font-medium">Découvrir</span>
</button>
<button class="flex flex-col items-center gap-1 text-[var(--primary-color)]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">person</span>
<span class="text-[10px] font-medium">Profil</span>
</button>
</div>

</body></html>
